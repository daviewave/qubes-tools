# blacklist stops alias-based autoloading; install ... /bin/false also
# blocks explicit modprobe and dependency pulls.
blacklist cramfs
install cramfs /bin/false
blacklist freevxfs
install freevxfs /bin/false
blacklist jffs2
install jffs2 /bin/false
blacklist hfs
install hfs /bin/false
blacklist hfsplus
install hfsplus /bin/false
blacklist udf
install udf /bin/false
blacklist firewire-core
install firewire-core /bin/false
blacklist firewire-sbp2
install firewire-sbp2 /bin/false
blacklist firewire-net
install firewire-net /bin/false
blacklist irda
install irda /bin/false
blacklist sir_dev
install sir_dev /bin/false
blacklist bluetooth
install bluetooth /bin/false
blacklist btusb
install btusb /bin/false
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
blacklist ipmi_si
install ipmi_si /bin/false
blacklist ipmi_devintf
install ipmi_devintf /bin/false
blacklist floppy
install floppy /bin/false
blacklist n_hdlc
install n_hdlc /bin/false
blacklist joydev
install joydev /bin/false
blacklist vfat
install vfat /bin/false
